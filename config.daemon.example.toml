[daemon]
id = "maidkit-host-01"
transport = "http"
listen = "127.0.0.1:8747"
metricsSecret = "replace-with-local-metrics-secret"
metricsHistoryPath = "/var/lib/maidcafe/metrics"
metricsRetentionDays = 7
cloudUrl = "https://mk.solsynth.dev"
cloudSecret = "replace-with-cloud-issued-secret"
metricsInterval = "1m"
# One <kind>.toml fragment per configured alarm, merged at load. Alarms are
# evaluated locally against each metric sample; the daemon reports a
# daemon.alarm.<kind> notification to the cloud when a threshold is exceeded.
alarmsDir = "/etc/maidcafe/alarms"
# One <slug>.toml fragment per scheduled job, merged at load. Each fragment
# holds one job's fields (the same shape as a [[daemon.jobs]] entry).
jobsDir = "/etc/maidcafe/jobs"
# Captured container logs (JSONL per container, rotated at 512 KiB, pruned by
# metricsRetentionDays). 0 disables log tracking.
logsDir = "/var/lib/maidcafe/logs"
logsInterval = "30s"
# Cadence at which the daemon compares every container's image against its
# registry, so GET /api/v1/updates can answer "is this container outdated?"
# without a client waiting on a registry. It reads manifest metadata only — it
# never pulls — and reaches registries over HTTPS with the daemon account's own
# runtime credential when one is stored. 0 disables the cadence; an on-demand
# check for one container still works.
updateCheckInterval = "6h"
# Upload is opt-in because logs may contain credentials or user data. The
# daemon batches lines and sends them to POST /api/daemons/:id/logs.
logsUploadEnabled = false
logsUploadInterval = "30s"
logsUploadBatchLines = 100
# Managed allowlist for cloud uploads (logs + container status). Empty = upload
# every container (default). Match by exact container name or ID prefix, or by
# compose project label (com.docker.compose.project / io.podman.compose.project).
# managedContainers = ["web", "db-"]
# managedComposes = ["myapp"]
# Publish container status (state/image/compose) to the cloud so managed hosts
# can be inspected centrally. Opt-in; paced on the metrics tick. Status carries
# no secrets. Logs remain gated by logsUploadEnabled + this allowlist.
statusUploadEnabled = false
# One <slug>.toml fragment per regex log alert.
logAlertsDir = "/etc/maidcafe/log-alerts"

# Alarm fragments can use cpu_percent, memory_used_percent, or
# disk_used_percent with threshold (percentage). container_down accepts an
# optional target container name or ID and does not need a threshold.
# Every action/webhook execution is appended here as JSONL (rotated at 1 MiB,
# one generation kept). Empty disables auditing.
auditPath = "/var/lib/maidcafe/audit.jsonl"
streamInterval = "1s"
containersInterval = "5s"
imagesInterval = "60s"
processesInterval = "10s"
processesLimit = 50
systemdInterval = "30s"
# 0 disables the runtimes collector
runtimesInterval = "10s"
# Database health snapshot cadence for the `databaseMetrics` stream event and
# /api/v1/database-metrics. 0 disables the collector.
databaseMetricsInterval = "10s"
# Runtime groups the runtimes collector reports, in wire order. Old clients
# skip unknown entries.
runtimes = ["java", "dotnet", "python", "node", "deno", "go", "ruby", "php"]
# Extra process names (ps comm) to track alongside the runtimes. Can also be
# managed dynamically via the watched-processes API; the persisted file is
# authoritative once it exists.
watchedProcesses = []
watchedProcessesFile = "/var/lib/maidcafe/watched-processes.json"
requestTimeout = "10s"
# Per-run deadline for hooks without their own `timeout`. 0 disables the
# deadline: the command runs until it completes (e.g. a deploy whose image
# pull may take arbitrarily long). An unbounded run holds a concurrency slot
# and blocks later relayed invocations while it runs.
scriptTimeout = "30s"
maxBodyBytes = 65536
maxConcurrentRuns = 4

[[daemon.webhooks]]
name = "backup"
secret = "replace-with-local-webhook-secret"
command = "/usr/local/bin/maidkit-backup"
args = ["--mode", "incremental"]
enabled = true
notifyOnSuccess = false
notifyOnFailure = true

[[daemon.actions]]
name = "cleanup"
command = "/usr/local/bin/maidkit-cleanup"
args = ["--retention-days", "7"]
enabled = true

# Deployed scripts may also pick a working directory, a run-as user, and
# environment assignments. Running as another user goes through sudo, so the
# daemon needs the sudoers rule MaidKit installs for it (note the two specs —
# sudoers wildcards do not cross "/", and user-mode scripts render under run):
#   maidcafe ALL=(<user>) NOPASSWD: /etc/maidcafe/actions/run/*, /etc/maidcafe/actions/*
[[daemon.actions]]
name = "deploy"
command = "/etc/maidcafe/actions/deploy.sh"
script = true
displayName = "Deploy the web app"
cwd = "/srv/myapp"
user = "deploy"
env = ["CI_BUILD=42", "NODE_ENV=production"]
enabled = true

# Scheduled jobs: a cron expression or an @every descriptor targeting a
# configured action or a native operation slug. Runs land in the audit log
# with source "job" and can notify on failure.
[[daemon.jobs]]
name = "nightly-backup"
schedule = "0 3 * * *"
action = "backup"
body = { job = "incremental" }
enabled = true
notifyOnFailure = true

# Log alert fragment example (`/etc/maidcafe/log-alerts/errors.toml`):
# name = "errors"
# pattern = "(?i)\\berror\\b|\\bfail(ed|ure)?\\b"
# container = "web"
# title = "Web container error"
# cooldownSeconds = 300
# enabled = true

[[daemon.jobs]]
name = "hourly-container-restart"
schedule = "@every 1h"
action = "container.restart"
body = { id = "web" }

# Opt-in interactive shell over WebSocket at GET /api/v1/terminal, for
# browser-based MaidKit builds that cannot open an SSH socket. Off by default:
# enabling it grants shell access on this host to whoever holds the credential.
# Unreachable in the stdio transport and unsupported on Windows. Never reports
# anything to the cloud.
[daemon.terminal]
enabled = false
# Absolute shell paths a session may request; the first is the default.
shells = ["/bin/bash"]
# Optional dedicated credential. Empty accepts metricsSecret instead.
# secret = "replace-with-terminal-secret"
# Optional allowlist for `sudo -H -u <user>` sessions; empty = daemon account.
# users = ["deploy"]
# Optional absolute working directory (default: the target account's home).
# cwd = "/srv/app"
# Optional KEY=VALUE entries added to the shell environment.
# env = ["LANG=C.UTF-8"]
# Browser origins allowed to open the socket (path.Match against the Origin
# host unless the pattern contains "://"); empty = same-host origins only.
# allowedOrigins = ["maidkit.solsynth.dev"]
# Allow sessions from outside loopback/RFC1918/link-local/Tailscale CGNAT.
# allowRemote = false
# maxSessions = 2
# idleTimeout = "15m"
# maxLifetime = "8h"

# Sessions the MaidCafe cloud hands to this daemon, for browser clients that
# cannot reach it (behind NAT). Off by default: enabling it lets the cloud's
# authorized workspace members open a shell here, so set `users` to say who.
# Requires cloudUrl/cloudSecret. The daemon only dials out.
[daemon.terminal.relay]
enabled = false
# Cloud identities allowed to open a relayed session (the Solarpass handle the
# cloud forwards); empty accepts any identity the cloud authorizes.
# users = ["you@solsynth.dev"]
# How long one pickup long-poll holds before returning empty (3s..25s).
# pollWait = "20s"

# Opt-in file API at /api/v1/files/*, for browser-based MaidKit builds that
# cannot open an SFTP channel: list, stat, read (windowed), write, mkdir, move,
# copy and delete. Off by default: enabling it grants file access on this host
# to whoever holds the credential. The same operations are reachable over the
# stdio transport as `files.*` actions, policy included.
[daemon.files]
enabled = false
# Absolute, existing directories the API may touch. Required when enabled;
# paths outside every root are refused, and a root itself can never be written,
# moved, copied or deleted through the API. The I/O runs through os.Root too,
# so a symlink inside a root cannot be used to escape it.
# A bare path list (`roots = ["/srv"]`) is still accepted and means the same as
# the unprivileged entry below; the array-of-tables form is required only to
# make a root privileged.
[[daemon.files.roots]]
path = "/srv"

# A privileged root is written through the maidkit-priv helper as root, for
# files the daemon account cannot write (an nginx or Caddy configuration, a
# systemd unit). `profile` names the helper profile that authorizes it and must
# exist in /etc/maidkit/priv.toml — the daemon's allowlist and the helper's are
# joined by two explicit decisions, never by a naming coincidence. Reads stay
# unprivileged, so the daemon account must still be able to read this directory
# to list it. See docs/PRIVILEGED.md.
# [[daemon.files.roots]]
# path = "/etc/nginx"
# privileged = true
# profile = "nginx"

# [daemon.priv] names the privileged helper and says which operations may be
# routed through it. Where the helper is installed: empty uses the compiled
# default. Setting it grants nothing on its own — an operation has to be routed
# here, and the helper has to have a grant for it in /etc/maidkit/priv.toml.
[daemon.priv]
# helper = "/usr/local/libexec/maidkit-priv"

# Route native systemd unit actions through the helper instead of the blanket
# `sudo -n systemctl` attempt. Off by default. When on, the helper is the only
# path: its own file lists the units and verbs, and a refusal from it is an
# error rather than a fallback to a wider sudo rule.
#
# The helper's grants look like this (/etc/maidkit/priv.toml):
#   [[systemd]]
#   unit = "nginx.service"
#   verbs = ["restart", "reload"]
systemd = false

# Route package operations through the helper. Off by default, and on the same
# terms as systemd: the helper's own [packages] table declares the manager and
# the verbs, and a refusal from it is an error rather than a fallback to a
# blanket `sudo -n apt-get` rule. `install` runs a package's maintainer scripts
# as root, so grant the verbs one at a time.
packages = false

# Route firewall operations through the helper. Off by default. The helper's
# own [firewall] table declares the backend and the rules' verbs; a rule is a
# port, a protocol and a source, never a raw rule or another command.
firewall = false
# Allow the mutating operations (write, mkdir, move, copy, delete). Leave off
# to publish a read-only view of a tree.
allowWrite = false
# Optional dedicated credential. Empty accepts metricsSecret instead; setting
# it keeps a leaked metrics secret from granting file access. GET
# /api/v1/files/content is the one route that also accepts it as ?token=, for a
# browser download or image load; no other route does, so a leaked URL cannot
# change a file.
# secret = "replace-with-files-secret"
# Per-request caps. A read without an explicit window larger than maxReadBytes
# is refused (413) rather than truncated; use offset/limit to page it.
# maxReadBytes = 8388608
# maxWriteBytes = 8388608
# Per-listing cap; a larger directory is reported with truncated = true.
# maxListEntries = 5000
