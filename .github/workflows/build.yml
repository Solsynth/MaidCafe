name: Build MaidCafe

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
    branches: [master]
  workflow_dispatch:


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ vars.PACKAGE_OWNER }}/maidcafe-cloud

permissions:
  contents: read

jobs:
  cloud-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish cloud image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  daemon-artifacts:
    if: github.event_name == 'pull_request' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            architecture: amd64
            goos: linux
            goarch: amd64
            extension: ''
          - platform: linux
            architecture: arm64
            goos: linux
            goarch: arm64
            extension: ''
          - platform: darwin
            architecture: amd64
            goos: darwin
            goarch: amd64
            extension: ''
          - platform: darwin
            architecture: arm64
            goos: darwin
            goarch: arm64
            extension: ''
          - platform: windows
            architecture: amd64
            goos: windows
            goarch: amd64
            extension: .exe
          - platform: windows
            architecture: arm64
            goos: windows
            goarch: arm64
            extension: .exe
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build compressed daemon binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -eu
          mkdir -p dist
          binary="maidcafe-daemon${{ matrix.extension }}"
          archive="maidcafe-daemon-${{ matrix.platform }}-${{ matrix.architecture }}.tar.gz"
          go build -trimpath -ldflags='-s -w' -o "dist/$binary" ./cmd/daemon
          tar -C dist -czf "$archive" "$binary"

      - name: Upload compressed daemon binary
        uses: actions/upload-artifact@v4
        with:
          name: maidcafe-daemon-${{ matrix.platform }}-${{ matrix.architecture }}-${{ github.sha }}
          path: maidcafe-daemon-${{ matrix.platform }}-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error

  daemon-rolling-artifacts:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            architecture: amd64
            goos: linux
            goarch: amd64
          - platform: linux
            architecture: arm64
            goos: linux
            goarch: arm64
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build compressed rolling daemon binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -eu
          mkdir -p dist
          binary=maidcafe-daemon
          archive="maidcafe-daemon-${{ matrix.platform }}-${{ matrix.architecture }}.tar.gz"
          go build -trimpath -ldflags='-s -w' -o "dist/$binary" ./cmd/daemon
          tar -C dist -czf "$archive" "$binary"

      - name: Upload compressed rolling daemon binary
        uses: actions/upload-artifact@v4
        with:
          name: maidcafe-daemon-${{ matrix.platform }}-${{ matrix.architecture }}-${{ github.sha }}
          path: maidcafe-daemon-${{ matrix.platform }}-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error

  # Configure repository variable DISTRIBUTION_API_BASE_URL and
  # DISTRIBUTION_PRODUCT_ID, plus secret DISTRIBUTION_UPLOAD_KEY.
  upload-daemon-to-distribution:
    needs: daemon-artifacts
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/') && needs.daemon-artifacts.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Each job publishes to the same release; the distribution backend
      # rejects concurrent publishes with 409, so run them one at a time.
      max-parallel: 1
      matrix:
        include:
          - platform: linux
            architecture: amd64
          - platform: linux
            architecture: arm64
          - platform: darwin
            architecture: amd64
          - platform: darwin
            architecture: arm64
          - platform: windows
            architecture: amd64
          - platform: windows
            architecture: arm64
    permissions:
      contents: read
    steps:
      - name: Download daemon binary
        uses: actions/download-artifact@v4
        with:
          name: maidcafe-daemon-${{ matrix.platform }}-${{ matrix.architecture }}-${{ github.sha }}
          path: ./dist

      - name: Resolve distribution version
        id: distribution_version
        shell: bash
        run: |
          version="$GITHUB_REF_NAME"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "tag must be a SemVer version without a leading v: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload daemon binary to DistributionCenter
        uses: Solsynth/SolsynthExpressUpload@v2
        with:
          api-base-url: ${{ vars.DISTRIBUTION_API_BASE_URL }}
          product-id: ${{ vars.DISTRIBUTION_PRODUCT_ID }}
          api-key: ${{ secrets.DISTRIBUTION_UPLOAD_KEY }}
          version: ${{ steps.distribution_version.outputs.version }}
          file: ./dist/maidcafe-daemon-${{ matrix.platform }}-${{ matrix.architecture }}.tar.gz
          platform: ${{ matrix.platform }}
          architecture: ${{ matrix.architecture }}
          mime-type: application/gzip
          channel: stable

  # Publish the latest master commit independently from stable releases.
  upload-daemon-rolling-to-distribution:
    needs: daemon-rolling-artifacts
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && needs.daemon-rolling-artifacts.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Same release is published from both matrix jobs; serialize to avoid 409.
      max-parallel: 1
      matrix:
        include:
          - platform: linux
            architecture: amd64
          - platform: linux
            architecture: arm64
    permissions:
      contents: read
    steps:
      - name: Download daemon binary
        uses: actions/download-artifact@v4
        with:
          name: maidcafe-daemon-${{ matrix.platform }}-${{ matrix.architecture }}-${{ github.sha }}
          path: ./dist

      - name: Resolve rolling version
        id: rolling_version
        shell: bash
        run: echo "version=${GITHUB_SHA:0:6}" >> "$GITHUB_OUTPUT"

      - name: Upload rolling daemon binary to DistributionCenter
        uses: Solsynth/SolsynthExpressUpload@v2
        with:
          api-base-url: ${{ vars.DISTRIBUTION_API_BASE_URL }}
          product-id: ${{ vars.DISTRIBUTION_PRODUCT_ID }}
          api-key: ${{ secrets.DISTRIBUTION_UPLOAD_KEY }}
          version: ${{ steps.rolling_version.outputs.version }}
          file: ./dist/maidcafe-daemon-${{ matrix.platform }}-${{ matrix.architecture }}.tar.gz
          platform: ${{ matrix.platform }}
          architecture: ${{ matrix.architecture }}
          mime-type: application/gzip
          channel: rolling
