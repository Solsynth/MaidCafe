name: Build MaidCafe

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ vars.PACKAGE_OWNER }}/maidcafe-cloud

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build cloud and daemon binaries
        run: go build ./cmd/cloud ./cmd/daemon

  cloud-image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish cloud image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  daemon-systemd-artifact:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build daemon systemd bundle
        run: |
          mkdir -p dist/maidcafe-daemon
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' \
            -o dist/maidcafe-daemon/maidcafe-daemon ./cmd/daemon
          cp deploy/maidcafe-daemon.service dist/maidcafe-daemon/
          cp config.daemon.example.toml dist/maidcafe-daemon/config.daemon.example.toml
          tar -C dist -czf maidcafe-daemon-systemd.tar.gz maidcafe-daemon

      - name: Upload daemon systemd bundle
        uses: actions/upload-artifact@v4
        with:
          name: maidcafe-daemon-systemd-${{ github.sha }}
          path: maidcafe-daemon-systemd.tar.gz
          if-no-files-found: error
