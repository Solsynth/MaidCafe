name: Build MaidCafe

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
    branches: [master]
  workflow_dispatch:


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ vars.PACKAGE_OWNER }}/maidcafe-cloud

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build cloud and daemon binaries
        run: go build ./cmd/cloud ./cmd/daemon

  cloud-image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish cloud image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  daemon-systemd-artifact:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build daemon systemd bundle
        run: |
          mkdir -p dist/maidcafe-daemon
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' \
            -o dist/maidcafe-daemon/maidcafe-daemon ./cmd/daemon
          cp deploy/maidcafe-daemon.service dist/maidcafe-daemon/
          cp config.daemon.example.toml dist/maidcafe-daemon/config.daemon.example.toml
          tar -C dist -czf maidcafe-daemon-systemd.tar.gz maidcafe-daemon

      - name: Upload daemon systemd bundle
        uses: actions/upload-artifact@v4
        with:
          name: maidcafe-daemon-systemd-${{ github.sha }}
          path: maidcafe-daemon-systemd.tar.gz
          if-no-files-found: error

  # Configure repository variable DISTRIBUTION_API_BASE_URL and
  # DISTRIBUTION_PRODUCT_ID, plus secret DISTRIBUTION_UPLOAD_KEY.
  upload-daemon-to-distribution:
    needs: daemon-systemd-artifact
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/') && needs.daemon-systemd-artifact.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download daemon systemd bundle
        uses: actions/download-artifact@v4
        with:
          name: maidcafe-daemon-systemd-${{ github.sha }}
          path: ./dist

      - name: Resolve distribution version
        id: distribution_version
        shell: bash
        run: |
          version="$GITHUB_REF_NAME"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "tag must be a SemVer version without a leading v: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload daemon systemd bundle to DistributionCenter
        uses: Solsynth/SolsynthExpressUpload@v2
        with:
          api-base-url: ${{ vars.DISTRIBUTION_API_BASE_URL }}
          product-id: ${{ vars.DISTRIBUTION_PRODUCT_ID }}
          api-key: ${{ secrets.DISTRIBUTION_UPLOAD_KEY }}
          version: ${{ steps.distribution_version.outputs.version }}
          file: ./dist/maidcafe-daemon-systemd.tar.gz
          platform: linux
          architecture: amd64
          mime-type: application/gzip
          channel: stable

  # Publish the latest master commit independently from stable releases.
  upload-daemon-rolling-to-distribution:
    needs: daemon-systemd-artifact
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && needs.daemon-systemd-artifact.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download daemon systemd bundle
        uses: actions/download-artifact@v4
        with:
          name: maidcafe-daemon-systemd-${{ github.sha }}
          path: ./dist

      - name: Resolve rolling version
        id: rolling_version
        shell: bash
        run: echo "version=${GITHUB_SHA:0:6}" >> "$GITHUB_OUTPUT"

      - name: Upload rolling daemon bundle to DistributionCenter
        uses: Solsynth/SolsynthExpressUpload@v2
        with:
          api-base-url: ${{ vars.DISTRIBUTION_API_BASE_URL }}
          product-id: ${{ vars.DISTRIBUTION_PRODUCT_ID }}
          api-key: ${{ secrets.DISTRIBUTION_UPLOAD_KEY }}
          version: ${{ steps.rolling_version.outputs.version }}
          file: ./dist/maidcafe-daemon-systemd.tar.gz
          platform: linux
          architecture: amd64
          mime-type: application/gzip
          channel: rolling
