[app]
name = "MaidCafe"

[http]
port = "8080"

[database]
# Replace the example password and connection settings before deployment.
dsn = "host=postgres user=maidcafe password=change-me dbname=maidcafe port=5432 sslmode=disable"

[auth]
target = "stargate:9090"
useTLS = true
tlsSkipVerify = false

[workspace]
# WattEngine workspace service (DyWorkspaceService). Daemons belong to a
# workspace; membership is verified against this service on every access.
target = "valve:9090"
useTLS = true
tlsSkipVerify = false

[ring]
# Optional Metoer/Ring gRPC target for device push delivery.
target = "metoer:9090"
useTLS = false
tlsSkipVerify = false

[eventbus]
# Optional NATS URL. Leave empty to disable push fan-out.
url = ""
