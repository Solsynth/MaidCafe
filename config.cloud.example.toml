[app]
name = "MaidCafe"

[http]
port = "8080"

[database]
# Replace the example password and connection settings before deployment.
dsn = "host=postgres user=maidcafe password=change-me dbname=maidcafe port=5432 sslmode=disable"

[auth]
target = "stargate:9090"
useTLS = true
tlsSkipVerify = false

[workspace]
# WattEngine workspace service (DyWorkspaceService). Daemons belong to a
# workspace; membership is verified against this service on every access.
target = "valve:9090"
useTLS = true
tlsSkipVerify = false

[ring]
# Optional Metoer/Ring gRPC target for device push delivery.
target = "metoer:9090"
useTLS = false
tlsSkipVerify = false

[eventbus]
# Optional NATS URL. Leave empty to disable push fan-out.
url = ""
# Optional subject namespace for this deployment, e.g. "staging" publishes to
# "staging.maidcafe.notification.v1" instead of "maidcafe.notification.v1".
subjectPrefix = ""

[cloud]
# A daemon with an accepted metric older than this is marked disconnected
# and emits one daemon.disconnected notification until it reports again.
daemonDisconnectAfter = "5m"
# Suppress another disconnect notification for this period after a prior one,
# even if the daemon briefly wakes up and then goes stale again.
daemonDisconnectNotificationCooldown = "30m"
# How often the cloud evaluates daemon heartbeat state.
alarmCheckInterval = "1m"
