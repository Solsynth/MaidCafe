[app]
name = "MaidCafe"

[http]
port = "8080"
# Browser origins allowed to open the cloud's WebSocket terminal socket
# (GET /api/daemons/<id>/terminal), matched with path.Match against the Origin
# host. Empty allows same-host origins only, so a MaidKit web build served from
# another host must be listed here. Requires the cloud to be served over TLS,
# since a browser page on https:// cannot open ws://.
# allowedOrigins = ["maidkit.solsynth.dev", "localhost:8080"]

[database]
# Replace the example password and connection settings before deployment.
dsn = "host=postgres user=maidcafe password=change-me dbname=maidcafe port=5432 sslmode=disable"

[grpc]
# Fleet certificate material for every outbound gRPC dial: Blade discovery,
# the auth service (Stargate), the workspace service (Valve) and Metoer (Ring).
# Fleet gRPC now requires a client certificate signed by the fleet CA, so
# without these the cloud cannot reach Stargate at all. The files are PEM; a
# relative path resolves against the process working directory.
#
# Leave caFile empty only when the peers present certificates this host cannot
# verify (self-signed deployments) — dials then skip verification.
# GRPC_CA_FILE, GRPC_CLIENT_CERT_FILE and GRPC_CLIENT_KEY_FILE set the same
# three paths from the environment, which is how a mounted secret is injected.
# caFile = "Keys/ca.crt"
# clientCertFile = "Keys/maidcafe.crt"
# clientKeyFile = "Keys/maidcafe.key"

[discovery]
# Blade service registry (DyServiceDiscoveryService). The dial follows the
# target scheme: grpc:// is plaintext, grpcs:// and https:// are TLS, and a
# bare host:port (below) is TLS — the fleet convention.
target = "blade:7001"
service = "stargate"

[auth]
# Turns off peer verification for the auth dial. With [grpc] caFile set this
# must stay false: setting it drops the CA and disables verification.
tlsSkipVerify = false

[workspace]
# WattEngine workspace service (DyWorkspaceService). Daemons belong to a
# workspace; membership is verified against this service on every access.
target = "valve:9090"
useTLS = true
tlsSkipVerify = false

[ring]
# Optional Metoer/Ring gRPC target for device push delivery. Mutual TLS only
# applies once useTLS is on; Metoer's shipped listener is plaintext, so the
# client certificate above is idle until that changes.
target = "metoer:9090"
useTLS = false
tlsSkipVerify = false

[eventbus]
# Optional NATS URL. Leave empty to disable push fan-out.
url = ""
# Optional subject namespace for this deployment, e.g. "staging" publishes to
# "staging.maidcafe.notification.v1" instead of "maidcafe.notification.v1".
subjectPrefix = ""

[cloud]
# A daemon with an accepted metric older than this is marked disconnected
# and emits one daemon.disconnected notification until it reports again.
daemonDisconnectAfter = "5m"
# Suppress another disconnect notification for this period after a prior one,
# even if the daemon briefly wakes up and then goes stale again.
daemonDisconnectNotificationCooldown = "30m"
# How often the cloud evaluates daemon heartbeat state.
alarmCheckInterval = "1m"
