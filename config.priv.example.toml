# Profile file for maidkit-priv, the privileged file helper.
#
# Installed as /etc/maidkit/priv.toml with mode 0644 and owner root. This file
# is the authorization boundary for privileged file writes: the sudoers rule
# authorizes the helper, and the helper can only reach the directories named
# here. Keep it root-owned and unwritable by anyone else — a file the daemon's
# own account could rewrite would be a privilege grant it can edit.
#
# Every entry is validated before any operation runs: the path must be absolute
# and resolve to an existing directory, and the modes may only be 0600, 0640,
# 0644, 0700, 0750 or 0755. Setuid, setgid and sticky bits are refused because
# the helper creates files root may execute.
#
# Check a change with `maidkit-priv fs profiles`, which parses the file and
# prints what it grants, before relying on it.

# An nginx configuration tree: the file manager edits sites-enabled,
# sites-available and snippets. The daemon account can read these files, so
# only the writes need root.
[[profiles]]
name = "nginx"
path = "/etc/nginx"
modes = ["0644", "0640"]

# Caddy needs the same treatment for its Caddyfile and any site fragments.
[[profiles]]
name = "caddy"
path = "/etc/caddy"
modes = ["0644", "0640"]

# systemd units deployed by MaidKit. Keep the path narrow: everything under
# /etc/systemd/system is loaded by PID 1 as root on the next daemon-reload, so
# a profile here is a code-execution grant for whoever can reach the daemon.
# Deliberately commented out until an operator needs it.
# [[profiles]]
# name = "systemd-units"
# path = "/etc/systemd/system"
# modes = ["0644"]

# Systemd unit actions. The daemon routes these here only with
# `[daemon.priv] systemd = true`, and this list is what makes that routing
# safe: a unit is named here with the verbs it may receive, so the daemon can
# only act on what an operator declared. Without this the daemon's systemd
# operations have no way to elevate.
#
# Keep the list to the units a client actually needs to restart, and prefer
# `reload` over `restart` where a service supports it: restarting takes the
# service down, and a reload usually does not.
[[systemd]]
unit = "nginx.service"
verbs = ["reload", "restart"]

# [[systemd]]
# unit = "caddy.service"
# verbs = ["reload"]

# Package operations. A manager run as root is the largest grant in this file:
# a package's maintainer scripts run as root, so `install` executes code the
# operator did not write, from the distribution's repositories. The verbs are
# therefore granted one at a time, and the manager is declared here — a caller
# can never choose the binary.
#
# Homebrew is absent on purpose: it installs into a user-owned prefix and is
# designed to run without root.
#
# The daemon routes these here only with `[daemon.priv] packages = true`.
# [packages]
# manager = "apt"
# verbs = ["refresh", "upgrade", "install", "remove"]

# Firewall rules. This grant is about exposure rather than about a program: an
# allow on an administrative port opens it to whoever can reach the host, and
# `disable` removes every rule at once — which is why it is a verb of its own
# and not implied by the rule verbs.
#
# A rule is a port, a protocol and a source, each validated against its own
# grammar; there is no way to reach a raw rule or another command.
#
# Careful with the port the operator is connected on: a deny on it, or a delete
# of its allow, locks the host out of the network — including out of this
# daemon. The firewall does not know or care which port that is.
#
# The daemon routes these here only with `[daemon.priv] firewall = true`.
# [firewall]
# backend = "ufw"
# verbs = ["enable", "disable", "allow", "deny", "delete"]
